name: crawl-and-notify

on:
  schedule:
    # UTC 기준. 한국시간(KST=UTC+9) 08:00 / 13:00 / 18:00 에 실행.
    - cron: "0 23,4,9 * * *"
  workflow_dispatch: {}   # 저장소의 Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 크롤링
        run: python scripts/crawl.py

      - name: 음악 신규 공고 이메일 발송
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python scripts/notify.py

      - name: 결과 커밋 (data/postings.json 갱신 → 사이트 반영)
        if: always()
        run: |
          git config user.name "edujob-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/postings.json data/debug_dump.html
          git diff --quiet --cached || git commit -m "채용공고 자동 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
